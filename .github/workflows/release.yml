name: Release

# Runs on every commit push.
# Builds all artefacts and publishes them to a rolling "latest" pre-release
# on the GitHub Releases page (overwriting the previous build each time).
# Push a proper vX.Y.Z tag to promote a real versioned release.

on:
  push:

permissions:
  contents: write   # required to create/upload release assets

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fat jar  (cross-platform, runs anywhere with Java 21+)
  # ---------------------------------------------------------------------------
  fat-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Safety net: gradlew loses its executable bit when committed from Windows.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build fat jar
        run: ./gradlew shadowJar

      - name: Rename for release clarity
        run: mv build/libs/BytecodeLens-*-all.jar build/libs/BytecodeLens-all.jar

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload fat jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name == 'latest' && 'Latest build' || steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: build/libs/BytecodeLens-all.jar

  # ---------------------------------------------------------------------------
  # 2. Native installers  (.msi · · .deb)
  # ---------------------------------------------------------------------------
  native-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jpackage-type: msi
            suffix: windows-x64.msi
          - os: ubuntu-latest
            jpackage-type: deb
            suffix: linux-x64.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable (Unix only)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build runtime jar
        run: ./gradlew jar

      # copyRuntimeDeps writes into build/jpackage-input/ — run FIRST,
      # then overlay our own app.jar so Gradle doesn't clobber it.
      - name: Stage jpackage input directory
        shell: bash
        run: |
          ./gradlew -q copyRuntimeDeps
          cp build/libs/BytecodeLens-*.jar build/jpackage-input/app.jar
          ls -la build/jpackage-input | head

      # jpackage --app-version rejects the "v" prefix (Windows .msi requires
      # a pure numeric ProductVersion). Strip it, and fall back to 0.0.0 for
      # branch commits that have no version tag.
      - name: Compute clean version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            clean="${GITHUB_REF_NAME#v}"
          else
            clean="0.0.0"
          fi
          echo "value=$clean" >> "$GITHUB_OUTPUT"
          echo "Using version: $clean"

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run jpackage (Windows .msi)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          jpackage \
            --type msi \
            --name BytecodeLens \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "BytecodeLens" \
            --description "The Java RE cockpit" \
            --input build/jpackage-input \
            --main-jar app.jar \
            --main-class dev.share.bytecodelens.Launcher \
            --win-shortcut \
            --win-menu \
            --dest build/installers

      - name: Run jpackage (Linux .deb)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          jpackage \
            --type deb \
            --name bytecodelens \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor "BytecodeLens" \
            --description "The Java RE cockpit" \
            --input build/jpackage-input \
            --main-jar app.jar \
            --main-class dev.share.bytecodelens.Launcher \
            --icon icons/BytecodeLens-C1-avatar-512.png \
            --linux-shortcut \
            --dest build/installers

      - name: Rename installer for clarity
        shell: bash
        run: |
          cd build/installers
          mv "$(ls)" "BytecodeLens-${{ matrix.suffix }}"

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name == 'latest' && 'Latest build' || steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: build/installers/BytecodeLens-${{ matrix.suffix }}
